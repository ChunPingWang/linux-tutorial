# Fedora 44 Server Kickstart
text
lang en_US.UTF-8
keyboard us
timezone Asia/Taipei --utc
timesource --ntp-server=time.stdtime.gov.tw

# 網路：DHCP + 主機名
network --bootproto=dhcp --device=link --activate --hostname=fedora-auto.example.com

# 安裝來源（netinst 用）；DVD 版可改成 cdrom
url --mirrorlist="https://mirrors.fedoraproject.org/mirrorlist?repo=fedora-44&arch=x86_64"
repo --name=updates --mirrorlist="https://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f44&arch=x86_64"

# 使用者：鎖 root、建立 wheel 管理員（密碼用 openssl passwd -6 產生）
rootpw --lock
user --name=sysop --groups=wheel --iscrypted --password='$6$rounds=4096$saltsalt$4gZ3hVdJvJZk9pRQx5Ig7KmzuhBRD0xKmFGm5N1Q3wfZ1qKZ8Ri2CQ7O.pTNvB4E9JuYfN3hVbC5pQeXvpRIb/'
sshkey --username=sysop "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleKeyReplaceMe sysop@laptop"

# 安全
selinux --enforcing
firewall --enabled --service=ssh
services --enabled=sshd,chronyd,firewalld

# 磁碟：清空 sda，UEFI + LVM + xfs
ignoredisk --only-use=sda
zerombr
clearpart --all --initlabel --disklabel=gpt
bootloader --location=mbr --append="console=tty0 console=ttyS0,115200n8"
part /boot/efi --fstype=efi   --size=1024
part /boot     --fstype=xfs   --size=2048
part pv.01     --fstype=lvmpv --size=1 --grow
volgroup vg0 pv.01
logvol /        --vgname=vg0 --name=lv_root --fstype=xfs --size=30720
logvol /var     --vgname=vg0 --name=lv_var  --fstype=xfs --size=20480
logvol /var/log --vgname=vg0 --name=lv_log  --fstype=xfs --size=8192
logvol swap     --vgname=vg0 --name=lv_swap --fstype=swap --size=4096
logvol /home    --vgname=vg0 --name=lv_home --fstype=xfs --size=1 --grow

%packages
@^server-product-environment
@headless-management
vim-enhanced
htop
curl
qemu-guest-agent
-plymouth*
%end

%post --log=/root/ks-post.log
echo 'sysop ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/90-sysop
chmod 440 /etc/sudoers.d/90-sysop
systemctl enable qemu-guest-agent
%end

reboot

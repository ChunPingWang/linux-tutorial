global
    log /dev/log local0
    maxconn 50000
    user haproxy
    group haproxy
    daemon
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log     global
    mode    http
    option  dontlognull
    option  http-server-close
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    timeout http-request 10s
    retries 3

frontend stats
    option httplog
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:changeme

frontend http_in
    option httplog
    option forwardfor
    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/site.pem alpn h2,http/1.1
    http-request redirect scheme https unless { ssl_fc }
    http-response set-header Strict-Transport-Security "max-age=31536000"
    acl is_api path_beg /api
    use_backend api_servers if is_api
    default_backend web_servers

backend web_servers
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    cookie SRV insert indirect nocache
    server web1 192.168.1.21:8080 check inter 3s fall 3 rise 2 cookie web1
    server web2 192.168.1.22:8080 check inter 3s fall 3 rise 2 cookie web2
    server web3 192.168.1.23:8080 check backup

backend api_servers
    balance leastconn
    option httpchk GET /api/health
    server api1 192.168.1.31:9000 check
    server api2 192.168.1.32:9000 check

listen pgsql
    mode tcp
    bind *:5432
    option tcplog
    option tcp-check
    balance first
    server pg1 192.168.1.41:5432 check port 8008 inter 3s   # Patroni REST /primary 健康檢查
    server pg2 192.168.1.42:5432 check port 8008 inter 3s backup
